name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # rust-build-v3.0.1
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/rust-build.yml@9be95371356a8f82615ff3dd0a6df945265d33a6
    with:
      rust-version: '1.98.0'
      working-directory: "."
      enable-cache: true
      publish-crates-io: false

  prepare:
    name: Determine image tag
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'iExecBlockchainComputing'
    outputs:
      image_tag: ${{ steps.determine-tag.outputs.image_tag }}
    steps:
      - name: Determine base tag
        id: determine-tag
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha=$(echo "$HEAD_SHA" | cut -c1-8)

          case "$BRANCH" in
            main)              echo "image_tag=dev-${short_sha}" | tee -a $GITHUB_OUTPUT;;
            feat/*|fix/*)      echo "image_tag=feature-${short_sha}" | tee -a $GITHUB_OUTPUT;;
            release-please--*) : ;;
            *)
              echo "❌ Branch does not respect naming rules: $BRANCH"
              echo "Expected one of: main, feat/*, fix/*, release-please--*"
              exit 1
              ;;
          esac

  build-oci-image:
    name: Build OCI images
    needs: prepare
    if: needs.prepare.outputs.image_tag != ''
    strategy:
      matrix:
        package: [post-compute, pre-compute]
    # docker-build-v3.8.0
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/docker-build.yml@71e6b9e61eefe6ca92540523ff2589274399b7cd
    with:
      image-name: docker.io/iexechub/tee-worker-${{ matrix.package }}-rust
      image-tag: ${{ needs.prepare.outputs.image_tag }}
      dockerfile: ${{ matrix.package }}/Dockerfile
      context: .
      registry: docker.io
      push: true
      security-scan: true
      security-report: "sarif"
      hadolint: true
      platform: linux/amd64
    secrets:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_PAT }}
