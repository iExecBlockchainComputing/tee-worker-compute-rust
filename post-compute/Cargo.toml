[package]
name = "tee-worker-post-compute"
version = "0.3.1"
edition = "2024"

[[bin]]
name = "tee-worker-post-compute"
path = "src/bin/tee_worker_post_compute.rs"

[dependencies]
aes = "0.9.3"
alloy-signer = "2.4.1"
alloy-signer-local = "2.4.1"
cbc = { version = "0.2.1", features = ["alloc"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
base64 = "0.22.1"
log = "0.4.34"
rand = "0.8.8"
rsa = "0.9.10"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "default-tls"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha256 = { version = "1.6.0", default-features = false }
sha3 = "0.10.8"
strum = "0.28.0"
strum_macros = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
walkdir = "2.5.0"
zip = { version = "4.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
logtest = "2.0.0"
mockall = "0.15.0"
once_cell = "1.21.3"
serial_test = "3.2.0"
temp-env = "0.3.6"
tokio = "1.53.1"
wiremock = "0.6.5"
